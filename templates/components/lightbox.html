<div class="lightbox" data-lightbox aria-hidden="true">
  <button class="lightbox__btn lightbox__btn--close" data-lb-close aria-label="{{ tr.lightbox_close }}">×</button>
  <button class="lightbox__btn lightbox__btn--prev" data-lb-prev aria-label="{{ tr.lightbox_prev }}">‹</button>
  <button class="lightbox__btn lightbox__btn--next" data-lb-next aria-label="{{ tr.lightbox_next }}">›</button>
  <img class="lightbox__img" alt="" />
</div>
